<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Illustrative batch run: discovery, then one line per job with its tracker status">
  <defs>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
      .dim { fill: #64748b; } .txt { fill: #e2e8f0; } .cmd { fill: #7dd3fc; }
      .ok { fill: #4ade80; } .warn { fill: #fbbf24; } .skip { fill: #94a3b8; } .acc { fill: #c4b5fd; }
      .l { animation: show 0.35s ease-out both; }
      @keyframes show { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      .d1{animation-delay:.3s}.d2{animation-delay:1.1s}.d3{animation-delay:1.7s}.d4{animation-delay:2.3s}
      .d5{animation-delay:3.1s}.d6{animation-delay:4.3s}.d7{animation-delay:5.5s}.d8{animation-delay:6.5s}
      .d9{animation-delay:7.5s}.d10{animation-delay:8.5s}.d11{animation-delay:9.5s}.d12{animation-delay:10.5s}
      .d13{animation-delay:11.3s}.d14{animation-delay:12.1s}.d15{animation-delay:12.9s}
      .cur { animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
    </style>
  </defs>
  <rect width="960" height="520" rx="14" fill="#0f172a"/>
  <rect width="960" height="40" rx="14" fill="#1e293b"/>
  <rect y="26" width="960" height="14" fill="#1e293b"/>
  <circle cx="24" cy="20" r="6" fill="#f87171"/><circle cx="44" cy="20" r="6" fill="#fbbf24"/><circle cx="64" cy="20" r="6" fill="#4ade80"/>
  <text x="480" y="25" text-anchor="middle" class="m dim" font-size="13">claude — job-application-agent (illustrative run, fictional companies)</text>

  <g class="m">
    <text x="24" y="76" class="l d1"><tspan class="acc">›</tspan> <tspan class="txt">Run Phase A: search and evaluate a batch of 20.</tspan></text>
    <text x="24" y="106" class="l d2"><tspan class="dim">$</tspan> <tspan class="cmd">python scripts/li_jobs.py search</tspan>   <tspan class="dim"># 143 postings</tspan></text>
    <text x="24" y="130" class="l d3"><tspan class="dim">$</tspan> <tspan class="cmd">python scripts/li_jobs.py filter</tspan>   <tspan class="dim"># 37 not yet in the tracker</tspan></text>
    <text x="24" y="154" class="l d4"><tspan class="dim">$</tspan> <tspan class="cmd">python scripts/li_jobs.py screen</tspan>   <tspan class="dim"># 21 pass the language gate</tspan></text>
    <text x="24" y="178" class="l d5"><tspan class="dim">  EVALUATE → 20 rows Qualified, 1 Skipped (needs 3 yrs experience)</tspan></text>

    <text x="24" y="218" class="l d6"><tspan class="acc">›</tspan> <tspan class="txt">/clear  ·  Run Phase B: apply to the queue, 10 at a time.</tspan></text>
    <text x="24" y="250" class="l d7"><tspan class="ok">✔</tspan> <tspan class="txt">Kestrel AI — Working Student LLM Platform — </tspan><tspan class="ok">Submitted</tspan></text>
    <text x="24" y="274" class="l d8"><tspan class="ok">✔</tspan> <tspan class="txt">Lumen Robotics — Master Thesis Perception — </tspan><tspan class="ok">Submitted</tspan></text>
    <text x="24" y="298" class="l d9"><tspan class="warn">◐</tspan> <tspan class="txt">Brightfield Health — Werkstudent Data — </tspan><tspan class="warn">NeedsUser</tspan><tspan class="dim"> (account wall, no saved login)</tspan></text>
    <text x="24" y="322" class="l d10"><tspan class="ok">✔</tspan> <tspan class="txt">Vellum Labs — Intern Backend (Python) — </tspan><tspan class="ok">Submitted</tspan></text>
    <text x="24" y="346" class="l d11"><tspan class="skip">✖</tspan> <tspan class="txt">Orbit Logistics — Praktikum ML — </tspan><tspan class="skip">Skipped</tspan><tspan class="dim"> (posting asks German C1)</tspan></text>
    <text x="24" y="370" class="l d12"><tspan class="ok">✔</tspan> <tspan class="txt">Halcyon Energy — Working Student GenAI — </tspan><tspan class="ok">Submitted</tspan></text>
    <text x="24" y="394" class="l d13"><tspan class="dim">  …</tspan></text>

    <text x="24" y="434" class="l d14"><tspan class="dim">$</tspan> <tspan class="cmd">python scripts/tracker.py stats</tspan></text>
    <text x="24" y="460" class="l d15"><tspan class="txt">  Submitted </tspan><tspan class="ok">7</tspan><tspan class="txt">  ·  NeedsUser </tspan><tspan class="warn">2</tspan><tspan class="txt">  ·  Skipped </tspan><tspan class="skip">1</tspan><tspan class="txt">  ·  Qualified </tspan><tspan class="acc">10</tspan><tspan class="dim">  (next cycle)</tspan></text>
  </g>
  <rect class="cur" x="24" y="478" width="10" height="18" fill="#c4b5fd" opacity="0.8"/>
</svg>
